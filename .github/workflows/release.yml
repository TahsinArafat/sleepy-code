name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.6)"
        required: true
        default: "0.1.6"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        working-directory: packages/opencode
        run: bun install

      - name: Create draft release first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          echo "VERSION=v${VERSION}" >> "$GITHUB_ENV"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --draft

      - name: Build binaries and upload to release
        working-directory: packages/opencode
        env:
          SLEEPYCODE_CHANNEL: prod
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun run script/build.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --draft=false
