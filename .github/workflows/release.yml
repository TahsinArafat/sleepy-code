name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        working-directory: packages/opencode
        run: bun install

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --draft

      - name: Build and upload binaries
        working-directory: packages/opencode
        env:
          SLEEPYCODE_CHANNEL: latest
          SLEEPYCODE_RELEASE: "true"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun run script/build.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
